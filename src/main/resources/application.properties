#Nombre del proyecto
spring.application.name=conectividad-peru
# Configuración de Conexión a SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db_conectividad_peru;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# DevTools para recarga automática en desarrollo
spring.devtools.restart.enabled=true

# Mostrar las consultas SQL en la consola de IntelliJ (útil para depurar)
spring.jpa.show-sql=true