<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Global de Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="mb-4 fw-bold text-dark">Panel de Prueba Global</h2>

    <div class="row g-4">

        <!-- PRUEBA COMPAÑERO 1: OPERADORAS -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100 border-primary">
                <div class="card-header bg-primary text-white fw-bold">
                    Compañero 1 (/operadoras) -> ${listaOperadoras}
                </div>
                <div class="card-body overflow-auto" style="max-height: 250px;">
                    <ul class="list-group">
                        <li class="list-group-item text-break" th:each="fila : ${listaOperadoras}">
                            <span th:text="${fila}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- PRUEBA COMPAÑERO 2: VELOCIDAD -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100 border-danger">
                <div class="card-header bg-danger text-white fw-bold">
                    Compañero 2 (/velocidad) -> ${velNacional} y ${rankingDistritos}
                </div>
                <div class="card-body overflow-auto" style="max-height: 250px;">
                    <p class="mb-1 text-muted"><strong>velNacional (Map):</strong></p>
                    <div class="alert alert-secondary p-2 text-break" th:text="${velNacional}"></div>

                    <p class="mb-1 text-muted mt-3"><strong>rankingDistritos (List):</strong></p>
                    <ul class="list-group">
                        <li class="list-group-item text-break py-1" th:each="fila : ${rankingDistritos}">
                            <span th:text="${fila}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- PRUEBA COMPAÑERO 3: TELETRABAJO -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100 border-success">
                <div class="card-header bg-success text-white fw-bold">
                    Compañero 3 (/teletrabajo) -> ${listaTeletrabajo}
                </div>
                <div class="card-body overflow-auto" style="max-height: 250px;">
                    <ul class="list-group">
                        <li class="list-group-item text-break" th:each="fila : ${listaTeletrabajo}">
                            <span th:text="${fila}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- PRUEBA COMPAÑERO 4: EDUCACIÓN -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100 border-warning">
                <div class="card-header bg-warning text-dark fw-bold">
                    Compañero 4 (/educacion) -> ${listaEducacion}
                </div>
                <div class="card-body overflow-auto" style="max-height: 250px;">
                    <ul class="list-group">
                        <li class="list-group-item text-break" th:each="fila : ${listaEducacion}">
                            <span th:text="${fila}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
