<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatorio de Conectividad - Operadoras</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<!-- Navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">📶 Observatorio de Conectividad en el Perú</a>
    </div>
</nav>

<!-- Contenido Principal -->
<div class="container my-5">
    <div class="row mb-4">
        <div class="col-12 text-center text-md-start">
            <h2 class="fw-bold text-dark">Dashboard de Cobertura y Operadoras</h2>
            <p class="text-muted">Distribución de antenas y centros poblados cubiertos a nivel nacional.</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- Gráfico Circular (Doughnut Chart) -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold text-primary">
                    📊 Participación de Antenas 4G
                </div>
                <div class="card-body d-flex align-items-center justify-content-center p-4">
                    <canvas id="chartOperadoras"></canvas>
                </div>
            </div>
        </div>

        <!-- Tabla de Datos -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold text-primary d-flex justify-content-between align-items-center">
                    <span>📋 Resumen por Empresa Operadora</span>
                </div>
                <div class="card-body p-0">

                    <!-- NUEVO: Caja de búsqueda agregada aquí, con un poco de padding (p-3) -->
                    <div class="p-3 border-bottom bg-light">
                        <input type="text" id="buscadorTabla" class="form-control shadow-sm" placeholder="🔍 Buscar por operadora, cantidad de antenas...">
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th>Empresa Operadora</th>
                                <th class="text-center">Total Antenas</th>
                                <th class="text-center">Centros Poblados Cubiertos</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Iteración Thymeleaf -->
                            <tr th:each="fila : ${listaOperadoras}">
                                <td class="fw-semibold text-capitalize" th:text="${fila.empresa_operadora}">Claro</td>
                                <td class="text-center" th:text="${fila.total_antenas}">0</td>
                                <td class="text-center" th:text="${fila.centros_poblados_cubiertos}">0</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script para renderizar Chart.js dinámicamente con datos de Thymeleaf -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // Extraemos la lista enviada desde Spring Boot en formato JSON
    const datosOperadoras = /*[[${listaOperadoras}]]*/ [];

    if (datosOperadoras && datosOperadoras.length > 0) {
        const etiquetas = datosOperadoras.map(item => item.empresa_operadora);
        const antenas = datosOperadoras.map(item => item.total_antenas);

        const ctx = document.getElementById('chartOperadoras').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Total Antenas',
                    data: antenas,
                    backgroundColor: [
                        '#031926', /* Azul Noche Oscuro */
                        '#468189', /* Verde Metálico */
                        '#77ACA2', /* Verde Suave */
                        '#9DBEBB', /* Celeste Opal */
                        '#F4E9CD', /* Crema Champagne */
                        '#1F4E55'  /* Tono extra oscuro por si hay 6ta operadora */
                    ],
                    borderColor: '#F4E9CD', /* Borde crema para separar las porciones */
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }
    /*]]>*/
</script>

<!-- NUEVO: Script de filtrado en tiempo real -->
<script>
    document.getElementById('buscadorTabla').addEventListener('keyup', function() {
        let textoBusqueda = this.value.toLowerCase();
        // Selecciona todas las filas del cuerpo de la tabla
        let filas = document.querySelectorAll('tbody tr');

        filas.forEach(function(fila) {
            let contenidoFila = fila.textContent.toLowerCase();
            // Oculta o muestra la fila dependiendo de si coincide con la búsqueda
            if(contenidoFila.includes(textoBusqueda)) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    });
</script>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
